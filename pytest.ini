[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    conformance: tests de conformité comportementale vis-à-vis d'Ollama (OC-080 à OC-084)
    e2e: tests de bout en bout nécessitant un vrai binaire llama-server (OC-085)
