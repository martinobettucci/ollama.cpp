# Environnement de PRODUCTION de `ollama.cpp`.
#
# @spec docs/BACKLOG.md OC-090 « Conteneurisation dev / staging / prod »
# @spec docs/DAT.md §6 « Authentification », §8 « Stratégie de déploiement »
# @spec docs/PROD_MIGRATIONS.md
#
# `ollama.cpp` est un composant INTERNE, placé derrière `ollama-gateway`. Il n'est donc pas publié
# sur une interface publique : le port n'est exposé que sur la boucle locale de l'hôte, et la
# gestion du catalogue est verrouillée par défaut.

services:
  ollama-cpp:
    image: ollama-cpp:prod
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    ports:
      # Boucle locale uniquement : la passerelle atteint le service, pas l'extérieur.
      - "127.0.0.1:${OLLAMACPP_PUBLISH_PORT:-11434}:11434"
    environment:
      OLLAMACPP_LOG_LEVEL: "${OLLAMACPP_LOG_LEVEL:-INFO}"
      # Le catalogue se gère depuis la console d'administration, pas depuis le flux d'inférence.
      OLLAMACPP_MANAGEMENT_ENABLED: "${OLLAMACPP_MANAGEMENT_ENABLED:-false}"
      OLLAMACPP_MAX_LOADED_MODELS: "${OLLAMACPP_MAX_LOADED_MODELS:-3}"
      OLLAMACPP_MEMORY_LIMIT_BYTES: "${OLLAMACPP_MEMORY_LIMIT_BYTES:-0}"
    volumes:
      - ${OLLAMACPP_MODELS_HOST_PATH:-models-prod}:/models
    restart: always
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: ${OLLAMACPP_MEMORY_LIMIT:-24g}

volumes:
  models-prod:
